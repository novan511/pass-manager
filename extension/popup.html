<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0f14;
        --surface: #121821;
        --border: #243041;
        --ink: #e8eef7;
        --muted: #8b9bb0;
        --accent: #6c7cff;
        --danger: #ff6b6b;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 340px;
        min-height: 420px;
        background: var(--bg);
        color: var(--ink);
        font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      .wrap { padding: 14px; }
      h1 {
        font-size: 14px;
        margin: 0 0 2px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .sub { color: var(--muted); font-size: 12px; margin: 0 0 12px; }
      label { display: block; color: var(--muted); font-size: 11px; font-weight: 600; margin-bottom: 4px; }
      input, button {
        width: 100%;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: #0a0e13;
        color: var(--ink);
        padding: 8px 10px;
        font: inherit;
      }
      input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
      button {
        margin-top: 10px;
        background: var(--accent);
        border-color: transparent;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      }
      button.secondary {
        background: transparent;
        border-color: var(--border);
        color: var(--ink);
        font-weight: 500;
      }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      .err {
        margin-top: 10px;
        color: var(--danger);
        font-size: 12px;
        white-space: pre-wrap;
      }
      .item {
        display: flex;
        flex-direction: column;
        gap: 2px;
        text-align: left;
        background: var(--surface);
        border: 1px solid var(--border);
        margin-top: 8px;
        padding: 9px 10px;
      }
      .item strong { font-size: 13px; }
      .item span { color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; }
      .row { display: flex; gap: 8px; }
      .row input { flex: 1; }
      .badge {
        display: inline-block;
        font-size: 10px;
        color: var(--muted);
        border: 1px solid var(--border);
        border-radius: 99px;
        padding: 1px 6px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Keyring Vault <span class="badge" id="host"></span></h1>
      <p class="sub" id="status">Encrypted vault · unlocked on this device only</p>
      <div id="stage-token">
        <label for="api">Base URL</label>
        <input id="api" placeholder="https://your-app.vercel.app" />
        <label for="token" style="margin-top: 8px">Extension token</label>
        <input id="token" placeholder="Paste token from Settings" />
        <button id="save-token">Connect</button>
      </div>
      <div id="stage-unlock" hidden>
        <label for="master">Master password</label>
        <input id="master" type="password" placeholder="••••••••••••" />
        <button id="unlock">Unlock vault</button>
        <button id="disconnect" class="secondary">Disconnect</button>
      </div>
      <div id="stage-list" hidden>
        <input id="search" placeholder="Search logins…" style="margin-bottom: 4px" />
        <div id="items"></div>
        <button id="lock" class="secondary">Lock</button>
      </div>
      <div class="err" id="error" hidden></div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
